name: Build APK

# Compila, prueba y exporta la APK.
#  - Con los secretos de firma configurados (ver SIGNING.md): APK de release
#    firmada, verificada y publicada como GitHub Release (en main o en tags v*).
#  - Sin ellos (p. ej. en pull requests): APK de depuración, solo como artefacto
#    descargable de la corrida.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      # Comprueba que gradle-wrapper.jar sea el oficial y activa la caché.
      - uses: gradle/actions/wrapper-validation@v6
      - uses: gradle/actions/setup-gradle@v6

      # La versión se define una sola vez, en app/build.gradle.kts.
      - name: Read app version
        run: |
          VERSION=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)
          test -n "$VERSION" || { echo "::error::No se encontró versionName en app/build.gradle.kts"; exit 1; }
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Versión: $VERSION"

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --console=plain

      # La llave llega exclusivamente de los secretos del repositorio. Se
      # escribe en un archivo temporal del runner, fuera del checkout, y se
      # borra al final pase lo que pase.
      - name: Prepare signing key
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          faltan=""
          for s in SIGNING_KEYSTORE_BASE64 SIGNING_STORE_PASSWORD SIGNING_KEY_ALIAS SIGNING_KEY_PASSWORD; do
            [ -n "${!s}" ] || faltan="$faltan $s"
          done
          if [ -n "$faltan" ]; then
            echo "::warning title=APK sin firma de release::Faltan los secretos$faltan (ver SIGNING.md). Se exporta una APK de depuración."
            echo "SIGNED=false" >> "$GITHUB_ENV"
            exit 0
          fi
          echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "SIGNING_STORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          echo "SIGNED=true" >> "$GITHUB_ENV"
          echo "✓ Llave de firma tomada de los secretos del repositorio"

      - name: Build signed release APK
        if: env.SIGNED == 'true'
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease --console=plain
          cp app/build/outputs/apk/release/app-release.apk "SJF-Tesis-v${VERSION}.apk"
          echo "APK=SJF-Tesis-v${VERSION}.apk" >> "$GITHUB_ENV"

      - name: Build debug APK
        if: env.SIGNED != 'true'
        run: |
          ./gradlew assembleDebug --console=plain
          cp app/build/outputs/apk/debug/app-debug.apk "SJF-Tesis-v${VERSION}-debug.apk"
          echo "APK=SJF-Tesis-v${VERSION}-debug.apk" >> "$GITHUB_ENV"

      # Verifica la firma. Si la variable SIGNING_CERT_SHA256 está definida,
      # exige además que sea la de la llave esperada (misma firma en cada
      # versión = las actualizaciones se instalan sin desinstalar).
      - name: Verify APK signature
        if: env.SIGNED == 'true'
        env:
          EXPECTED_CERT_SHA256: ${{ vars.SIGNING_CERT_SHA256 }}
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort | tail -1)
          "$APKSIGNER" verify --print-certs "$APK" | tee certs.txt
          ACTUAL=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' certs.txt | tr -d ':' | tr 'A-F' 'a-f')
          test -n "$ACTUAL" || { echo "::error::La APK no está firmada"; exit 1; }
          if [ -n "$EXPECTED_CERT_SHA256" ]; then
            EXPECTED=$(echo "$EXPECTED_CERT_SHA256" | tr -d ': ' | tr 'A-F' 'a-f')
            [ "$ACTUAL" = "$EXPECTED" ] || { echo "::error::La APK se firmó con una llave distinta a la esperada"; exit 1; }
            echo "✓ Firma verificada contra SIGNING_CERT_SHA256"
          else
            echo "::warning::Define la variable SIGNING_CERT_SHA256 = $ACTUAL para verificar la firma en cada build (ver SIGNING.md)."
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.APK }}
          path: ${{ env.APK }}
          if-no-files-found: error

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore

      # Solo las APK firmadas se publican como release (tag v<versión>).
      # Las notas de la versión viven en RELEASE_NOTES.md.
      - name: Publish GitHub Release
        if: env.SIGNED == 'true' && github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ env.VERSION }}
          name: SJF Tesis v${{ env.VERSION }}
          body_path: RELEASE_NOTES.md
          files: ${{ env.APK }}
          make_latest: true

      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"
